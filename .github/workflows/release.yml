name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Configure CMake (MSVC static CRT)
        run: |
          cmake -B build -S src `
            -DCMAKE_BUILD_TYPE=Release `
            -DGIGACPP_STATIC_CRT=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Install to staging directory
        run: |
          cmake --install build --config Release --prefix staging

      - name: Copy Documentation and Licenses
        run: |
          Copy-Item README.md, LICENSE staging/

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          $packageName = "GigaCppConnect-${{ steps.vars.outputs.TAG_NAME }}-windows-x86_64.zip"
          Compress-Archive -Path staging/* -DestinationPath $packageName
          echo "PACKAGED_FILE=$packageName" >> $env:GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: GigaCppConnect-*-windows-x86_64.zip

  build-linux-x86_64:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -S src \
            -DCMAKE_BUILD_TYPE=Release \
            -DGIGACPP_STATIC_STDLIB=ON \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN/../lib:\$ORIGIN/lib:\$ORIGIN"

      - name: Build
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Install to staging directory
        run: |
          cmake --install build --prefix staging

      - name: Bundle dependencies (libcurl & runtime libraries)
        shell: bash
        run: |
          mkdir -p staging/lib
          ldd staging/bin/GigaCppConnect | grep "=>" | awk '{print $3}' | while read -r lib; do
            if [ -f "$lib" ]; then
              base=$(basename "$lib")
              case "$base" in
                libc.*|libm.*|libdl.*|libpthread.*|ld-linux*|librt.*)
                  ;;
                *)
                  cp -L "$lib" staging/lib/ 2>/dev/null || true
                  ;;
              esac
            fi
          done

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:${LD_LIBRARY_PATH:-}"' \
            'exec "$SCRIPT_DIR/bin/GigaCppConnect" "$@"' \
            > staging/run.sh
          chmod +x staging/run.sh
          chmod +x staging/bin/GigaCppConnect

      - name: Copy Documentation and Licenses
        run: |
          cp README.md LICENSE staging/

      - name: Package Linux x86_64 Release (tar.gz)
        shell: bash
        run: |
          PKG_NAME="GigaCppConnect-${{ steps.vars.outputs.TAG_NAME }}-linux-x86_64.tar.gz"
          tar -czvf "$PKG_NAME" -C staging .
          echo "PACKAGED_FILE=$PKG_NAME" >> "$GITHUB_ENV"

      - name: Upload Linux x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x86_64
          path: GigaCppConnect-*-linux-x86_64.tar.gz

  build-linux-arm64:
    name: Build Linux (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build & Package in ARM64 container
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.TAG_NAME }}"
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/workspace \
            -w /workspace \
            arm64v8/ubuntu:22.04 \
            bash -c "
              apt-get update && apt-get install -y build-essential cmake libcurl4-openssl-dev
              rm -rf build-arm staging-arm
              cmake -B build-arm -S src -DCMAKE_BUILD_TYPE=Release -DGIGACPP_STATIC_STDLIB=ON -DCMAKE_INSTALL_RPATH='\\\$ORIGIN/../lib:\\\$ORIGIN/lib:\\\$ORIGIN'
              cmake --build build-arm -j\$(nproc)
              cmake --install build-arm --prefix staging-arm

              mkdir -p staging-arm/lib
              ldd staging-arm/bin/GigaCppConnect | grep '=>' | awk '{print \\\$3}' | while read -r lib; do
                if [ -f \"\\\$lib\" ]; then
                  base=\$(basename \"\\\$lib\")
                  case \"\\\$base\" in
                    libc.*|libm.*|libdl.*|libpthread.*|ld-linux*|librt.*) ;;
                    *) cp -L \"\\\$lib\" staging-arm/lib/ 2>/dev/null || true ;;
                  esac
                fi
              done

              printf '%s\n' \
                '#!/usr/bin/env bash' \
                'SCRIPT_DIR=\"\$(cd \"\$(dirname \"\${BASH_SOURCE[0]}\")\" && pwd)\"' \
                'export LD_LIBRARY_PATH=\"\\\$SCRIPT_DIR/lib:\${LD_LIBRARY_PATH:-}\"' \
                'exec \"\\\$SCRIPT_DIR/bin/GigaCppConnect\" \"\\\$@\"' \
                > staging-arm/run.sh
              chmod +x staging-arm/run.sh staging-arm/bin/GigaCppConnect
              cp README.md LICENSE staging-arm/
              tar -czvf GigaCppConnect-${TAG}-linux-aarch64.tar.gz -C staging-arm .
            "

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-arm64
          path: GigaCppConnect-*-linux-aarch64.tar.gz

  release:
    name: Publish Release
    needs: [build-windows, build-linux-x86_64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Create dist directory
        run: mkdir -p dist

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: dist

      - name: Download Linux x86_64 Package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-x86_64
          path: dist

      - name: Download Linux ARM64 Package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-arm64
          path: dist

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum GigaCppConnect-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: GigaCppConnect ${{ steps.vars.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            dist/GigaCppConnect-*-windows-x86_64.zip
            dist/GigaCppConnect-*-linux-x86_64.tar.gz
            dist/GigaCppConnect-*-linux-aarch64.tar.gz
            dist/SHA256SUMS.txt
          body: |
            Modern C++20 client framework for Sber's GigaChat LLM API.

            ### Packages

            All packages are standalone and include pre-built binaries, static libraries, C++ headers, and runtime dependencies:

            - **Windows (`x86_64`)**: `GigaCppConnect-${{ steps.vars.outputs.TAG_NAME }}-windows-x86_64.zip`
            - **Linux (`x86_64`)**: `GigaCppConnect-${{ steps.vars.outputs.TAG_NAME }}-linux-x86_64.tar.gz`
            - **Linux (`aarch64` / ARM64)**: `GigaCppConnect-${{ steps.vars.outputs.TAG_NAME }}-linux-aarch64.tar.gz`

            ### Verification

            SHA-256 checksums are provided in `SHA256SUMS.txt`.
